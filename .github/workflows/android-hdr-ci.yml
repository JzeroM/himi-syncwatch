name: Android HDR Signed Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-mpv-ci
    paths:
      - 'scripts/mpv/**'
      - 'plugins/himi_mpv_android/**'
      - 'plugins/himi_mpv_core/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/android-hdr-ci.yml'

concurrency:
  group: android-hdr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /opt/microsoft /usr/share/miniconda /usr/local/.ghcup || true
          sudo apt-get clean
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip zip python3 pkg-config \
            meson ninja-build cmake gperf nasm yasm bison flex gettext \
            autoconf automake libtool libtool-bin perl
      # Ubuntu 24.04 apt 的 Meson 是 1.3.2，而 fontconfig 当前要求 >=1.11.0。
      - name: Install newer Meson
        run: sudo python3 -m pip install --break-system-packages 'meson>=1.11'
      - name: Build patched Android libmpv
        run: |
          set -o pipefail
          if ! bash scripts/mpv/build_android.sh "${{ matrix.abi }}" 2>&1 | tee /tmp/android-libmpv.log; then
            tail -80 /tmp/android-libmpv.log
            grep -nE 'ERROR|error:|fatal:|FAILED|undefined reference' /tmp/android-libmpv.log | tail -20 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-libmpv-${{ matrix.abi }}
          path: build/mpv/out/android/jars/full-${{ matrix.abi }}.jar
          retention-days: 30

  build-android:
    needs: android-kernels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download patched Android libmpv jars
        uses: actions/download-artifact@v4
        with:
          pattern: android-libmpv-*
          path: ${{ runner.temp }}/mpv-jars
          merge-multiple: true
      - name: Point media_kit to patched Android jars
        run: echo "MEDIA_KIT_ANDROID_LIBMPV_DIR=$RUNNER_TEMP/mpv-jars" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp -r android/app/src/main /tmp/android_main_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms android /tmp/temp_proj
          mkdir -p android
          cp -a /tmp/temp_proj/android/* android/
          rm -rf /tmp/temp_proj
          rm -rf android/app/src/main
          cp -a /tmp/android_main_backup android/app/src/main
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true
      - name: Patch Android manifest/gradle
        run: bash scripts/patch_android.sh
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/patch_android_signing.sh
      - name: Verify source completeness
        run: bash scripts/verify_sources.sh
      - name: Flutter pub get
        run: flutter pub get
      - name: Build signed split APKs
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "❌ 缺少 GitHub Actions secret TRAKT_CLIENT_ID"
            exit 1
          fi
          flutter build apk --release --split-per-abi --build-number 529 \
            --dart-define=TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID"
      - name: Verify signature fingerprint
        run: |
          set -euo pipefail
          EXPECTED='7eac22a5829e4614e39f0a7cac4467b4bab1bc2cba4c1b78d85da7dc32014b17'
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo '找不到 apksigner'; exit 1; }
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*-release.apk)
          [ ${#APKS[@]} -ge 3 ] || { echo 'APK 数量不足 3'; exit 1; }
          for apk in "${APKS[@]}"; do
            FP=$("$APKSIGNER" verify --print-certs "$apk" 2>&1 |
              sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')
            echo "$apk: $FP"
            [ "$FP" = "$EXPECTED" ] || { echo "签名指纹不匹配: $apk"; exit 1; }
          done
      - name: Upload signed Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-hdr-release
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
