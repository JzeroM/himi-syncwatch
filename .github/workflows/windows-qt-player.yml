name: Windows Qt Player Build

# 656：HIMI Windows 播放器窗口（Qt Quick + libmpv）构建。
#
# 【产物去向】本工作流只产出 Qt 播放器目录（含 exe + Qt 运行时 + libmpv），
# 由 release.yml 的 build-windows 步骤下载后打进 Windows zip。
# 也可以手动触发单独下载来调试。
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/windows_qt_player/**'
      - '.github/workflows/windows-qt-player.yml'

env:
  QT_VERSION: '6.8.3'
  CLIENT_DIR: native/windows_qt_player

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      # mpv dev 包：libmpv-2.dll + include/mpv/client.h + libmpv.dll.a
      - name: 下载 libmpv dev 包（shinchiro）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'himi-build'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $($env:GITHUB_TOKEN)" }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' -Headers $headers -UseBasicParsing
          $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64-v3.*\.7z' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64.*\.7z' } | Select-Object -First 1 }
          if (-not $asset) { throw '未找到 shinchiro libmpv dev 包' }
          Write-Host "libmpv dev 资源：$($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z -UseBasicParsing
          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (!(Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress | Out-Null
            $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          }
          if (!(Test-Path $sevenZip)) { throw '7z.exe 未找到' }
          Remove-Item -Recurse -Force mpv-dev -ErrorAction SilentlyContinue
          & $sevenZip x mpv-dev.7z "-ompv-dev" -y | Out-Null
          $header = Get-ChildItem -Path mpv-dev -Recurse -Filter 'client.h' |
            Where-Object { $_.DirectoryName -match 'mpv' } | Select-Object -First 1
          if (-not $header) { throw '包内未找到 mpv/client.h' }
          $root = Split-Path (Split-Path $header.DirectoryName -Parent) -Parent
          Write-Host "LIBMPV_DIR=$root"
          "LIBMPV_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 【三个坑，都是 654 spike 实测踩过的】
      # 1. 不能用 "Visual Studio 17 2022" 生成器：runner 已升级 VS2026
      # 2. steps.install-qt.outputs.qt-dir 为空 → 用 QT_ROOT_DIR
      # 3. Ninja 默认挑 PATH 里的 gcc（预装 MinGW），与 MSVC 构建的 Qt
      #    ABI 不兼容 → 必须用 vcvars64 初始化 MSVC 环境
      - name: 配置 CMake (MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "未找到 vswhere.exe" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "未找到含 VC 工具集的 Visual Studio" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "未找到 vcvars64.bat: $vcvars" }
          Write-Host "VS: $vsPath"

          $cmd = 'call "' + $vcvars + '" >nul && cmake -S ' + $env:CLIENT_DIR +
                 ' -B build -G Ninja -DCMAKE_BUILD_TYPE=Release' +
                 ' -DCMAKE_PREFIX_PATH="' + $env:QT_ROOT_DIR + '"' +
                 ' -DLIBMPV_DIR="' + $env:LIBMPV_DIR + '"'
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

      - name: 编译
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c ('call "' + $vcvars + '" >nul && cmake --build build --parallel')
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

      - name: 部署 Qt6 runtime DLLs
        shell: pwsh
        run: |
          $qtBin = "$env:QT_ROOT_DIR/bin"
          & "$qtBin/windeployqt.exe" --qmldir "$env:CLIENT_DIR/src/qml" "build/himi_qt_player.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败" }

      # 捆绑 MSVC 运行时：纯净系统缺 VCRUNTIME140/MSVCP140 会直接闪退。
      # 做法与 release.yml 一致（vswhere 定位 + 通配 Microsoft.VC*.CRT）。
      - name: 捆绑 MSVC CRT DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build'
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vsWhere)) { throw "未找到 vswhere.exe" }
          $vsPath = & $vsWhere -latest -products * -property installationPath
          $redistRoot = Join-Path $vsPath 'VC\Redist\MSVC'
          $crtDir = $null
          if (Test-Path $redistRoot) {
            $crtDir = Get-ChildItem -Path $redistRoot -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
              Select-Object -First 1
          }
          if ($crtDir) {
            Copy-Item -Path (Join-Path $crtDir.FullName '*.dll') -Destination $rel -Force
            Write-Host "已捆绑 CRT: $($crtDir.FullName)"
          } else {
            Write-Host "::warning::未找到 VC Redist CRT 目录，跳过捆绑"
          }

      - name: 校验产物完整性
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build'
          foreach ($f in @('himi_qt_player.exe', 'libmpv-2.dll', 'Qt6Core.dll', 'Qt6Quick.dll', 'Qt6Qml.dll', 'Qt6Network.dll')) {
            $p = Join-Path $rel $f
            if (!(Test-Path $p)) { throw "产物缺少 $f($p)" }
            Write-Host "OK: $f ($((Get-Item $p).Length) bytes)"
          }
          # 662 EvolveUI 依赖的 QML 插件必须部署（MultiEffect 走
          # QtQuick.Effects、ESlider 的 SpinBox 走 QtQuick.Controls）。
          # windeployqt --qmldir 扫描 src/qml（含 evolveui/ 子目录）自动带，
          # 这里显式断言防止漏部署 → 运行期 "module not installed" 全黑。
          foreach ($q in @('qml\QtQuick\Effects', 'qml\QtQuick\Controls', 'qml\QtQuick\Controls\Basic')) {
            $p = Join-Path $rel $q
            if (!(Test-Path $p)) { throw "产物缺少 QML 插件目录 $q($p)" }
            Write-Host "OK: $q"
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: himi-qt-player-windows
          path: build/**
          if-no-files-found: error
