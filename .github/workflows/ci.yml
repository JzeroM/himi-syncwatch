name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'native/**'
      - '.github/workflows/windows-qt-client.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, master]

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - run: flutter pub get
      - run: dart analyze lib/

  auto-release:
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag
        run: |
          # 读取 pubspec.yaml 中的版本号
          VERSION=$(grep -oP 'version: \K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)
          TAG_NAME="v${VERSION}"
          
          echo "版本: $VERSION"
          echo "标签: $TAG_NAME"
          
          # 创建并推送 tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $TAG_NAME -m "Release $TAG_NAME"
          git push origin $TAG_NAME
          
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
        id: version

      - name: Trigger release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            console.log(`Triggering release for tag: ${tag}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: tag,
            });
