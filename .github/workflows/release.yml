name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: dart analyze lib/

  build-android:
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 Android 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          # android/app/src/main 是唯一事实来源：DV Kotlin 插件、HIMI 标签、
          # 权限清单都在其中，flutter create 的模板一概没有。
          # 不备份就整体替换的话，产物会缺 com.himi/dolby_vision 通道，
          # 真机表现为 MissingPluginException（且打包不报错，极难发现）。
          cp -r android/app/src/main /tmp/android_main_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows macos linux web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms android /tmp/temp_proj
          mkdir -p android
          cp -a /tmp/temp_proj/android/* android/
          rm -rf /tmp/temp_proj
          # 整体替换而非只补 kotlin/：连带还原 manifest 的 label 与全部权限，
          # 也顺带清掉模板同名的空 MainActivity，避免两个实现并存。
          rm -rf android/app/src/main
          cp -a /tmp/android_main_backup android/app/src/main
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - name: 添加自定义权限
        run: chmod +x scripts/patch_android.sh && bash scripts/patch_android.sh

      - name: 配置 APK 签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/patch_android_signing.sh

      # 打包前拦截源码缺失：这类问题构建阶段零报错，只在真机上炸
      - name: 校验 Android 源码完整性
        run: chmod +x scripts/verify_sources.sh && bash scripts/verify_sources.sh

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: 验证 APK 签名
        run: |
          set -euo pipefail
          echo "=== 验证 keystore 文件 ==="
          ls -la android/app/himi-release.jks
          echo "=== 验证 key.properties ==="
          cat android/key.properties
          echo "=== 验证签名注入到 build 文件 ==="
          GRADLE_FILE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ 找不到 android/app/build.gradle(.kts)"
            exit 1
          fi
          echo "目标文件: $GRADLE_FILE"
          grep -A 14 'signingConfigs' "$GRADLE_FILE"
          grep -E 'signingConfigs\.release|getByName\("release"\)' "$GRADLE_FILE"
          echo "=== 比对 APK 与 keystore 签名指纹 ==="
          # 不带 -v 的输出格式为 `Certificate fingerprint (SHA-256): xx`（v1.1.32 实测）；
          # -list -v 的 `SHA256:` 行在此环境解析不到。失败时打印原始输出便于诊断。
          KS_RAW=$(keytool -list -keystore android/app/himi-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 || true)
          KS_FP=$(echo "$KS_RAW" | sed -n 's/^.*Certificate fingerprint (SHA-256):[[:space:]]*//p' | head -1 | tr -d '[:space:]')
          if [ -z "$KS_FP" ]; then
            echo "❌ 读取 keystore 指纹失败，keytool 输出："
            echo "$KS_RAW"
            exit 1
          fi
          echo "keystore SHA-256: $KS_FP"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "❌ 未找到 release APK 产物"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            AP_RAW=$(keytool -printcert -jarfile "$apk" 2>&1 || true)
            APK_FP=$(echo "$AP_RAW" | sed -n 's/.*SHA256:[[:space:]]*//p' | head -1 | tr -d '[:space:]')
            echo "$apk SHA-256: $APK_FP"
            if [ -z "$APK_FP" ] || [ "${KS_FP^^}" != "${APK_FP^^}" ]; then
              echo "❌ $apk 签名与 keystore 不一致（或无法读取 APK 指纹），禁止发布"
              echo "$AP_RAW"
              exit 1
            fi
          done
          echo "✅ 全部 release APK 签名与 keystore 指纹一致"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    needs: [flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 iOS 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          # Info.plist（HIMI 显示名、权限文案）与 Assets.xcassets（应用图标、
          # 启动图）是仓库自定义内容，flutter create 模板一概没有。
          cp -r ios/Runner/Info.plist /tmp/ios_Info.plist.bak
          cp -r ios/Runner/Assets.xcassets /tmp/ios_assets_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows macos linux web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms ios /tmp/temp_proj
          mkdir -p ios
          cp -a /tmp/temp_proj/ios/* ios/
          rm -rf /tmp/temp_proj
          rm -rf ios/Runner/Info.plist ios/Runner/Assets.xcassets
          cp /tmp/ios_Info.plist.bak ios/Runner/Info.plist
          cp -a /tmp/ios_assets_backup ios/Runner/Assets.xcassets
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - name: 添加自定义权限
        run: |
          # 幂等写入：仓库 Info.plist 已含这些 key，-insert 遇到已存在会报错；
          # 改为先 -replace、失败再 -insert，模板与仓库版本都能跑通。
          plist_set() {
            local key=$1; shift
            plutil -replace "$key" "$@" ios/Runner/Info.plist 2>/dev/null \
              || plutil -insert "$key" "$@" ios/Runner/Info.plist
          }
          plist_set NSMicrophoneUsageDescription -string "声网实时消息需要麦克风权限"
          plist_set NSCameraUsageDescription -string "扫描二维码加入房间"
          plist_set NSPhotoLibraryUsageDescription -string "从相册选择二维码图片加入房间"
          plist_set NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}'
          plist_set UIBackgroundModes -json '["audio"]'
          echo "CFBundleDisplayName = $(plutil -extract CFBundleDisplayName raw ios/Runner/Info.plist)"

      # 打包前拦截源码缺失：这类问题构建阶段零报错，只在产物上表现为图标/显示名不对
      - name: 校验平台源码完整性
        run: bash scripts/verify_sources.sh

      - name: 设置 iOS 最低部署版本 + 禁用签名
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*"/DEVELOPMENT_TEAM = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r himi-sync-ios-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: himi-sync-ios-unsigned.ipa

  build-windows:
    needs: [flutter-analyze]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 Windows 平台文件
        run: |
          Copy-Item -Recurse lib /tmp/lib_backup
          Copy-Item pubspec.yaml /tmp/pubspec.yaml.bak -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force android,ios,windows,macos,linux,web,build,.dart_tool -ErrorAction SilentlyContinue
          flutter create --project-name himi_syncwatch --org com.himi --platforms windows C:/temp_proj
          New-Item -ItemType Directory -Force -Path windows
          Copy-Item -Recurse C:/temp_proj/windows/* windows/
          Remove-Item -Recurse -Force C:/temp_proj
          Remove-Item -Recurse -Force lib
          Copy-Item -Recurse /tmp/lib_backup lib
          Copy-Item /tmp/pubspec.yaml.bak pubspec.yaml -ErrorAction SilentlyContinue

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/

  build-macos:
    needs: [flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 macOS 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows macos linux web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms macos /tmp/temp_proj
          mkdir -p macos
          cp -a /tmp/temp_proj/macos/* macos/
          rm -rf /tmp/temp_proj
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - name: 设置 macOS 最低版本
        run: |
          sed -i '' -E 's/^([[:space:]]*MACOSX_DEPLOYMENT_TARGET)[[:space:]]*=.*/\1 = 10.15/' macos/Runner/Configs/AppInfo.xcconfig || true
          sed -i '' -E 's/^([[:space:]]*MACOSX_DEPLOYMENT_TARGET)[[:space:]]*=.*/\1 = 10.15/' macos/Podfile || true

      - run: flutter pub get
      - run: flutter build macos --release

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/

  build-linux:
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev liblzma-dev pkg-config libsecret-1-dev

      - name: 生成 Linux 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows macos linux web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms linux /tmp/temp_proj
          mkdir -p linux
          cp -a /tmp/temp_proj/linux/* linux/
          rm -rf /tmp/temp_proj
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: build/linux/x64/release/bundle/

  release:
    needs: [build-android, build-ios, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package release assets
        run: |
          mkdir -p release
          cp android-apk/*.apk release/ || true
          cd windows-exe && 7z a ../release/himi-sync-windows.zip . && cd .. || true
          MACOS_APP=$(find macos-app -name "*.app" -maxdepth 1 -type d | head -1)
          if [ -n "$MACOS_APP" ]; then
            cd macos-app && 7z a ../release/himi-sync-macos.zip "$(basename "$MACOS_APP")" && cd .. || true
          fi
          cd linux-binary && 7z a ../release/himi-sync-linux.zip . && cd .. || true
          cp ios-build/himi-sync-ios-unsigned.ipa release/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.zip
            release/*.ipa
          draft: false
          prerelease: false
