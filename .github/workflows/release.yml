name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  # ===== 后端测试 =====
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6.2'
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # ===== Flutter 静态分析 =====
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: dart analyze lib/

  # ===== Android APK =====
  build-android:
    needs: [server-test, flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ===== iOS (IPArchive) =====
  build-ios:
    needs: [server-test, flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  # ===== Windows =====
  build-windows:
    needs: [server-test, flutter-analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/

  # ===== macOS =====
  build-macos:
    needs: [server-test, flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/

  # ===== Linux =====
  build-linux:
    needs: [server-test, flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: dart pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: build/linux/x64/bundle/

  # ===== 发布 Release =====
  release:
    needs: [build-android, build-ios, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package release assets
        run: |
          # Android APK
          mkdir -p release
          cp android-apk/*.apk release/
          
          # Windows
          cd windows-exe
          7z a ../release/himi-sync-windows.zip .
          cd ..
          
          # macOS
          cd macos-app
          7z a ../release/himi-sync-macos.zip .
          cd ..
          
          # Linux
          cd linux-binary
          7z a ../release/himi-sync-linux.zip .
          cd ..
          
          # iOS (archive需要Xcode签名，这里只提供build)
          cp ios-build/Runner.app release/himi-sync-ios.app || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.zip
            release/*.app
          draft: false
          prerelease: false
