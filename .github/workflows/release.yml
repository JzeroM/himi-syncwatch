name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub get
      - run: dart analyze lib/

  build-android:
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    env:
      # mdk-sdk v0.39.0 版本锁定（GitHub Release，SHA 校验防资产替换）。
      # v0.39.0 含 "Fix EGL platform apis attribute type in EGL 1.4~1.5"
      # 修复，是盒子 eglChooseConfig 3004 黑屏实验（E0）的目标版本；
      # 不用 SF nightly 是因 522 故障史（commit ab70fb6）且内容不可控。
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.39.0
      FVP_DEPS_SHA256: cd196c9f6fb1872c4f35184848522ca3ab9c91196da47ca9761d8fb50e3e9cf3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 Android 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          # android/app/src/main 是唯一事实来源：DV Kotlin 插件、HIMI 标签、
          # 权限清单都在其中，flutter create 的模板一概没有。
          # 不备份就整体替换的话，产物会缺 com.himi/dolby_vision 通道，
          # 真机表现为 MissingPluginException（且打包不报错，极难发现）。
          cp -r android/app/src/main /tmp/android_main_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms android /tmp/temp_proj
          mkdir -p android
          cp -a /tmp/temp_proj/android/* android/
          rm -rf /tmp/temp_proj
          # 整体替换而非只补 kotlin/：连带还原 manifest 的 label 与全部权限，
          # 也顺带清掉模板同名的空 MainActivity，避免两个实现并存。
          rm -rf android/app/src/main
          cp -a /tmp/android_main_backup android/app/src/main
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - name: 添加自定义权限
        run: chmod +x scripts/patch_android.sh && bash scripts/patch_android.sh

      - name: 配置 APK 签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/patch_android_signing.sh

      # 打包前拦截源码缺失：这类问题构建阶段零报错，只在真机上炸
      - name: 校验 Android 源码完整性
        run: chmod +x scripts/verify_sources.sh && bash scripts/verify_sources.sh

      - run: flutter pub get
      - name: Run flutter build apk --release --split-per-abi
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "❌ 缺少 GitHub Actions secret TRAKT_CLIENT_ID"
            exit 1
          fi
          # 发布构建偶发 runner 网络/缓存抖动（v1.2.57 首轮曾整步失败），
          # 与 iOS 一致增加 3 次重试，避免单次抖动阻断整条发布链。
          for i in 1 2 3; do
            if flutter build apk --release --split-per-abi \
              --dart-define=TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID"; then exit 0; fi
            echo "❌ Android 构建失败，15 秒后重试（$i/3）"
            sleep 15
          done
          exit 1

      - name: 验证 APK 签名
        run: |
          set -euo pipefail
          echo "=== 验证 keystore 文件 ==="
          ls -la android/app/himi-release.jks
          echo "=== 验证 key.properties ==="
          cat android/key.properties
          echo "=== 验证签名注入到 build 文件 ==="
          GRADLE_FILE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1 || true)
          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ 找不到 android/app/build.gradle(.kts)"
            exit 1
          fi
          echo "目标文件: $GRADLE_FILE"
          grep -A 14 'signingConfigs' "$GRADLE_FILE"
          grep -E 'signingConfigs\.release|getByName\("release"\)' "$GRADLE_FILE"
          echo "=== 比对 APK 与 keystore 签名指纹 ==="
          # 不带 -v 的输出格式为 `Certificate fingerprint (SHA-256): xx`（v1.1.32 实测）；
          # -list -v 的 `SHA256:` 行在此环境解析不到。失败时打印原始输出便于诊断。
          KS_RAW=$(keytool -list -keystore android/app/himi-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 || true)
          KS_FP=$(echo "$KS_RAW" | sed -n 's/^.*Certificate fingerprint (SHA-256):[[:space:]]*//p' | head -1 | tr -d '[:space:]')
          if [ -z "$KS_FP" ]; then
            echo "❌ 读取 keystore 指纹失败，keytool 输出："
            echo "$KS_RAW"
            exit 1
          fi
          echo "keystore SHA-256: $KS_FP"
          KS_N=$(echo "$KS_FP" | tr -d ':' | tr 'A-F' 'a-f')
          # 现代 AGP 只写 v2/v3 签名块，keytool -printcert -jarfile 报 "Not a signed
          # jar file"，改用 apksigner（SDK build-tools 自带，输出小写无冒号）
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "❌ 找不到 apksigner（ANDROID_HOME=${ANDROID_HOME:-unset}）"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "❌ 未找到 release APK 产物"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            AP_RAW=$("$APKSIGNER" verify --print-certs "$apk" 2>&1 || true)
            APK_FP=$(echo "$AP_RAW" | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '[:space:]')
            echo "$apk SHA-256: $APK_FP"
            if [ -z "$APK_FP" ] || [ "$KS_N" != "$(echo "$APK_FP" | tr 'A-F' 'a-f')" ]; then
              echo "❌ $apk 签名与 keystore 不一致（或无法读取 APK 指纹），禁止发布"
              echo "$AP_RAW"
              exit 1
            fi
          done
          echo "✅ 全部 release APK 签名与 keystore 指纹一致"

      - name: 重命名 APK（带上版本号）
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed -n 's/^version: \([0-9.]*\).*/\1/p')
          echo "版本号: $VERSION"
          shopt -s nullglob
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            base=$(basename "$f")
            if [[ "$base" =~ ^app-(.+)-release\.apk$ ]]; then
              abi="${BASH_REMATCH[1]}"
              mv "$f" "build/app/outputs/flutter-apk/himi-sync-${VERSION}-${abi}.apk"
            elif [[ "$base" == "app-release.apk" ]]; then
              mv "$f" "build/app/outputs/flutter-apk/himi-sync-${VERSION}-universal.apk"
            fi
          done
          ls -la build/app/outputs/flutter-apk/*.apk
          # 防回归：--split-per-abi 应产出 armeabi-v7a/arm64-v8a/x86_64 三份；
          # 若重命名正则漏掉含短横线的 ABI，会静默丢包（曾致只发布 x86_64）。
          count=$(ls build/app/outputs/flutter-apk/himi-sync-*.apk 2>/dev/null | wc -l)
          if [ "$count" -lt 3 ]; then
            echo "❌ 期望至少 3 个 ABI 的 APK，实际 $count 个；检查重命名正则是否遗漏 ABI"
            ls -la build/app/outputs/flutter-apk/
            exit 1
          fi
          echo "✅ APK 数量校验通过：$count"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/himi-sync-*.apk

  build-ios:
    needs: [flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 生成 iOS 平台文件
        run: |
          cp -r lib /tmp/lib_backup
          # Info.plist（HIMI 显示名、权限文案）与 Assets.xcassets（应用图标、
          # 启动图）是仓库自定义内容，flutter create 模板一概没有。
          cp -r ios/Runner/Info.plist /tmp/ios_Info.plist.bak
          cp -r ios/Runner/Assets.xcassets /tmp/ios_assets_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp AGENTS.md /tmp/AGENTS.md.bak || true
          rm -rf android ios windows web build .dart_tool
          flutter create --project-name himi_syncwatch --org com.himi --platforms ios /tmp/temp_proj
          mkdir -p ios
          cp -a /tmp/temp_proj/ios/* ios/
          rm -rf /tmp/temp_proj
          rm -rf ios/Runner/Info.plist ios/Runner/Assets.xcassets
          cp /tmp/ios_Info.plist.bak ios/Runner/Info.plist
          cp -a /tmp/ios_assets_backup ios/Runner/Assets.xcassets
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AGENTS.md.bak AGENTS.md || true

      - name: 添加自定义权限
        run: |
          # 幂等写入：仓库 Info.plist 已含这些 key，-insert 遇到已存在会报错；
          # 改为先 -replace、失败再 -insert，模板与仓库版本都能跑通。
          plist_set() {
            local key=$1; shift
            plutil -replace "$key" "$@" ios/Runner/Info.plist 2>/dev/null \
              || plutil -insert "$key" "$@" ios/Runner/Info.plist
          }
          plist_set NSMicrophoneUsageDescription -string "声网实时消息需要麦克风权限"
          plist_set NSCameraUsageDescription -string "扫描二维码加入房间"
          plist_set NSPhotoLibraryUsageDescription -string "从相册选择二维码图片加入房间"
          plist_set NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}'
          plist_set UIBackgroundModes -json '["audio"]'
          echo "CFBundleDisplayName = $(plutil -extract CFBundleDisplayName raw ios/Runner/Info.plist)"

      # 备用应用图标（运行时切换）：flutter create 重建 iOS 工程会删掉
      # ios/Runner/Assets.xcassets 之外的图标资源；这里从仓库 assets/icon
      # 重新生成 Asset Catalog appiconset，并打开 Include All App Icon Assets
      # （否则备用 appiconset 不编进 Assets.car → setAlternateIconName -54）。
      - name: 生成 iOS 备用应用图标 + 配置构建设置
        run: |
          dart run tool/gen_icons.dart
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/configure_ios_icons.rb

      # 打包前拦截源码缺失：这类问题构建阶段零报错，只在产物上表现为图标/显示名不对
      # （放在 gen_icons 之后：备用图标 PNG 由 gen_icons 生成）
      - name: 校验平台源码完整性
        run: bash scripts/verify_sources.sh

      - name: 设置 iOS 最低部署版本 + 禁用签名
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*"/DEVELOPMENT_TEAM = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get

      - name: Run flutter build ios --release --no-codesign
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "❌ 缺少 GitHub Actions secret TRAKT_CLIENT_ID"
            exit 1
          fi
          # Agora 等 pod 走 download.agora.io，runner 偶发 DNS 解析失败（curl 6），重试 3 次。
          # 新版 Flutter 可能在 Xcode 已产出 Runner.app 后仍因未选 Development Team
          # 返回非 0；无签名 IPA 只需要 Runner.app，因此以产物存在为准。
          for i in 1 2 3; do
            flutter build ios --release --no-codesign \
              --dart-define=TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID" && exit 0
            if [ -d build/ios/iphoneos/Runner.app ]; then
              echo "⚠️ Flutter 退出非 0，但 Runner.app 已生成，继续打包未签名 IPA"
              exit 0
            fi
            echo "❌ iOS 构建失败，15 秒后重试（$i/3）"
            sleep 15
          done
          exit 1

      - name: 打包未签名 IPA（带版本号）
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -n 's/^version: \([0-9.]*\).*/\1/p')
          echo "版本号: $VERSION"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "himi-sync-ios-unsigned-${VERSION}.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: himi-sync-ios-unsigned-*.ipa

  build-windows:
    needs: [flutter-analyze]
    # windows-latest = VS18/MSVC 14.51，与 mdk v0.39.0（vs2026 工具链构建）
    # 同家族配对（fvp.dll 与 mdk.dll 跨 DLL 交互 C++ 对象，须同工具链），
    # 对齐 fvp 上游 CI 成功配置；windows-2022 系初始模板遗留。
    runs-on: windows-latest
    env:
      # mdk-sdk v0.39.0 自托管改名副本：上游 v0.37.0+ 资产改名
      # mdk-sdk-windows-x64-vs2026.7z，与 fvp deps.cmake 硬编码的
      # mdk-sdk-windows-x64.7z 不匹配（直指上游 v0.39.0 会 404），
      # 故用本仓库 deps-mirror release 存改名副本并 SHA 锁定。
      FVP_DEPS_URL: https://github.com/JzeroM/himi-syncwatch/releases/download/deps-mirror
      FVP_DEPS_SHA256: e492fd45f3a6828e44f75ce665708c9040abaa60602605437b71c95c714808e3
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # 仓库内 windows/ 为事实来源（HIMI 窗口标题、app_icon、插件注册由
      # flutter pub get 生成），不再用模板重建覆盖本地定制
      - run: flutter pub get
      - name: Run flutter build windows --release
        shell: pwsh
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TRAKT_CLIENT_ID)) {
            Write-Host "❌ 缺少 GitHub Actions secret TRAKT_CLIENT_ID"
            exit 1
          }
          # Windows runner 偶发 Flutter 工具链/缓存抖动，失败后重试 3 次。
          for ($i = 1; $i -le 3; $i++) {
            flutter build windows --release --dart-define=TRAKT_CLIENT_ID=$env:TRAKT_CLIENT_ID
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "❌ Windows 构建失败，15 秒后重试（$i/3）"
            Start-Sleep -Seconds 15
          }
          exit 1

      # 替换 media_kit 捆绑的 libmpv-2.dll 为完整版（shinchiro/mpv-winbuild-cmake）：
      # 上游 media-kit 默认 libmpv 解码器不完整（PGS 位图字幕 / 10bit / HDR 等），
      # 换完整 build 以补齐格式与字幕能力（对齐 NipaPlay 做法）。
      - name: 替换为完整 libmpv（shinchiro，补齐 PGS/格式）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco install 7zip -y --no-progress | Out-Null
          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (!(Test-Path $sevenZip)) { $sevenZip = Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe' }
          if (!(Test-Path $sevenZip)) { throw '7z.exe 未找到' }
          $headers = @{ 'User-Agent' = 'himi-build'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $($env:GITHUB_TOKEN)" }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' -Headers $headers -UseBasicParsing
          $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64-v3.*\.7z' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64.*\.7z' } | Select-Object -First 1 }
          if (-not $asset) { throw '未找到 shinchiro libmpv 包' }
          Write-Host "libmpv 资源：$($asset.name)"
          $archive = 'libmpv-full.7z'; $extract = 'libmpv-full'
          Remove-Item $archive,$extract -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -UseBasicParsing
          & $sevenZip x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem -Path $extract -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw '包内未找到 libmpv-2.dll' }
          $target = Join-Path 'build/windows/x64/runner/Release' 'libmpv-2.dll'
          Copy-Item -Path $dll.FullName -Destination $target -Force
          Write-Host "已替换 $target ($((Get-Item $target).Length) bytes)"

      - name: 验证插件与 Agora DLL 已打进产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'
          foreach ($f in @('himi_windows_rtm_plugin.dll', 'agora_rtm_sdk.dll', 'libaosl.dll')) {
            $p = Join-Path $rel $f
            if (!(Test-Path $p)) { throw "产物缺少 $f($p)" }
            Write-Host "OK: $f ($((Get-Item $p).Length) bytes)"
          }

      # 捆绑 MSVC CRT：Flutter Windows release 动态链接 VCRUNTIME140/MSVCP140，
      # 纯净 Win 系统或缺运行库时应用直接闪退。从 runner 的 VS CRT 再发行目录
      # 复制 3 个 DLL 随产物分发（zip 与 setup.exe 同时受益），MS 允许再分发。
      # 版本无关：不同 runner 镜像的 VS 版本/工具集不同（VC143/VC144/…），
      # 故用 vswhere 定位 VS 安装路径 + 通配 Microsoft.VC*.CRT，勿写死版本。
      - name: 捆绑 MSVC CRT DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'

          $need = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')

          # 候选目录1：VS 再发行目录 VC\Redist\MSVC\<ver>\x64\Microsoft.VC<ver>.CRT
          $candidates = [System.Collections.Generic.List[string]]::new()
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if (-not $vsPath) { $vsPath = & $vsWhere -latest -products * -property installationPath }
            if ($vsPath) {
              Write-Host "VS 安装路径: $vsPath"
              $redistRoot = Join-Path $vsPath 'VC\Redist\MSVC'
              if (Test-Path $redistRoot) {
                # 按路径降序：优先高版本工具集，且同一版本下桌面 x64 优先于 onecore
                Get-ChildItem -Path $redistRoot -Recurse -Filter 'vcruntime140.dll' `
                  -ErrorAction SilentlyContinue |
                  Where-Object { $_.DirectoryName -match '\\x64\\Microsoft\.VC[0-9]+\.CRT$' } |
                  Select-Object -ExpandProperty DirectoryName |
                  Sort-Object -Descending -Unique |
                  ForEach-Object { $candidates.Add($_) }
              }
            }
          }
          # 候选目录2：系统已安装的 VC 运行库（兜底，Windows runner 恒有）
          $candidates.Add("$env:SystemRoot\System32")

          $crtDir = $null
          foreach ($d in ($candidates | Select-Object -Unique)) {
            if (($need | Where-Object { -not (Test-Path (Join-Path $d $_)) }).Count -eq 0) {
              $crtDir = $d; break
            }
          }
          if (-not $crtDir) {
            Write-Host '候选目录列举：'
            $candidates | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
            throw '未找到包含全套 CRT DLL 的目录'
          }
          Write-Host "CRT 目录: $crtDir"
          foreach ($dll in $need) {
            Copy-Item -Path (Join-Path $crtDir $dll) -Destination (Join-Path $rel $dll) -Force
            Write-Host "已捆绑 $dll"
          }

      - name: 编译 Inno Setup 安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path ${env:ProgramFiles} 'Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) { throw '未找到 ISCC.exe' }

          $ver = (Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*([0-9.]+)' |
                  ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (-not $ver) { throw '无法从 pubspec.yaml 读取版本号' }
          Write-Host "版本号: $ver"

          # 中文语言文件非 Inno 自带：下载官方维护的中文翻译；失败则退回英文界面。
          $langDir = Join-Path (Split-Path $iscc) 'Languages'
          $zhIsl = Join-Path $langDir 'ChineseSimplified.isl'
          $extra = @()
          $zhUrls = @(
            'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl',
            'https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/master/ChineseSimplified.isl'
          )
          if (!(Test-Path $zhIsl)) {
            foreach ($u in $zhUrls) {
              try {
                Invoke-WebRequest -UseBasicParsing -Headers @{ 'User-Agent' = 'himi-build' } -Uri $u -OutFile $zhIsl
                if (Test-Path $zhIsl) { break }
              } catch {
                Write-Warning "中文语言文件下载失败（$u）: $_"
              }
            }
          }
          if (Test-Path $zhIsl) {
            $extra += '/DIncludeChinese=1'
            Write-Host '启用中文安装界面'
          } else {
            Write-Warning '未获取到中文语言文件，退回英文安装界面'
          }

          New-Item -ItemType Directory -Force -Path 'build/windows/setup' | Out-Null
          & $iscc "/DMyAppVersion=$ver" @extra 'scripts\windows\himi_sync.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }
          Get-ChildItem 'build/windows/setup' | ForEach-Object { Write-Host "产物: $($_.Name) ($($_.Length) bytes)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/windows/setup/*.exe

  release:
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    # 默认仅在三平台构建全部成功时发布：此前 always() 会在平台失败时
    # 发布不完整 release（v1.2.11 实测缺 Android APK 仍发布，事故）。
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package release assets（带版本号）
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed -n 's/^version: \([0-9.]*\).*/\1/p')
          echo "版本号: $VERSION"
          mkdir -p release
          cp android-apk/*.apk release/ 2>/dev/null || true
          cp windows-setup/*.exe release/ 2>/dev/null || true
          if [ -d windows-exe ]; then
            cd windows-exe
            7z a "../release/himi-sync-windows-${VERSION}.zip" .
            cd ..
          fi
          cp ios-build/*.ipa release/ 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.zip
            release/*.ipa
            release/*.exe
          draft: false
          prerelease: false
