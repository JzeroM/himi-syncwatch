name: Windows RTM Plugin Build

# 仅手动触发：验证 himi_windows_rtm 插件在 Windows 上编译、SDK 下载链接、
# 运行时 DLL 打包；不发版（发版走 release.yml tag 流程）。
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 验证插件与 Agora DLL 已打进产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'
          foreach ($f in @('himi_windows_rtm_plugin.dll', 'agora_rtm_sdk.dll', 'libaosl.dll')) {
            $p = Join-Path $rel $f
            if (!(Test-Path $p)) { throw "产物缺少 $f($p)" }
            Write-Host "OK: $f ($((Get-Item $p).Length) bytes)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-rtm-exe
          path: build/windows/x64/runner/Release/

  # 在 runner 上真实运行冒烟：初始化/登录/订阅/发布全链路，崩溃时从
  # Windows 事件日志取 faulting module 定位
  smoke-rtm:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-rtm-exe
          path: app

      - name: Run RTM smoke (HIMI_RTM_SMOKE=1)
        id: smoke
        shell: pwsh
        run: |
          $env:HIMI_RTM_SMOKE = '1'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'app\himi_syncwatch.exe'
          if (!(Test-Path $exe)) { throw "找不到 $exe" }
          $p = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput smoke_out.txt -RedirectStandardError smoke_err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw '冒烟超时120s' }
          Write-Host "exit=$($p.ExitCode)"
          Write-Host '--- smoke stdout ---'
          Get-Content smoke_out.txt -Tail 50 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "冒烟失败 exit=$($p.ExitCode)" }

      - name: Dump crash event log
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 5 |
            ForEach-Object { $_.Message; '---' }
          Get-Content smoke_err.txt -Tail 30 -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Filter 'himi_runtime.log' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { "LOG: $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
