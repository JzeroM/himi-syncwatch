name: Windows Qt Player Spike

# 654：Qt 播放器窗口 spike 构建。
#
# 【为什么是手动触发】本工作流只产出验证用的 exe（Qt + mpv + HDR 直出），
# 不参与正式发版；正式 Windows 产物仍由 release.yml 的 build-windows 负责。
# 等 660 把 Qt 播放器接进主流程后，这里才会并入 release.yml。
#
# 【本轮验证目标】mpv 用 `wid` 直出到 Qt 创建的 HWND 时，HDR 是否还在？
on:
  workflow_dispatch:
    inputs:
      client_dir:
        description: 'Qt 客户端源目录'
        required: false
        default: 'native/windows_qt_client'

env:
  QT_VERSION: '6.8.3'
  CLIENT_DIR: ${{ inputs.client_dir || 'native/windows_qt_client' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6（Quick / QuickControls2 属基础包）
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      # mpv dev 包：既提供 libmpv-2.dll，也提供 include/mpv/client.h
      # 与 libmpv.dll.a。release.yml 目前只取了 DLL，这里需要全套。
      - name: 下载 libmpv dev 包（shinchiro）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'himi-build'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $($env:GITHUB_TOKEN)" }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' -Headers $headers -UseBasicParsing
          $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64-v3.*\.7z' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match 'mpv-dev-x86_64.*\.7z' } | Select-Object -First 1 }
          if (-not $asset) { throw '未找到 shinchiro libmpv dev 包' }
          Write-Host "libmpv dev 资源：$($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z -UseBasicParsing
          # 7z 在 windows-latest 上已预装（choco 亦可）
          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (!(Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress | Out-Null
            $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          }
          if (!(Test-Path $sevenZip)) { throw '7z.exe 未找到' }
          Remove-Item -Recurse -Force mpv-dev -ErrorAction SilentlyContinue
          & $sevenZip x mpv-dev.7z "-ompv-dev" -y | Out-Null
          Get-ChildItem -Recurse mpv-dev | Select-Object -First 30 FullName | Format-Table -AutoSize
          $header = Get-ChildItem -Path mpv-dev -Recurse -Filter 'client.h' |
            Where-Object { $_.DirectoryName -match 'mpv' } | Select-Object -First 1
          if (-not $header) { throw '包内未找到 mpv/client.h' }
          $root = Split-Path (Split-Path $header.DirectoryName -Parent) -Parent
          Write-Host "LIBMPV_DIR=$root"
          "LIBMPV_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 配置 CMake (MSVC)
        shell: pwsh
        run: |
          # 用 Ninja 而不是 "Visual Studio 17 2022"：windows-latest 已升级到
          # VS2026，写死 VS2022 生成器会报 "could not find any instance of
          # Visual Studio"（v1.5.75 的 654 spike 实测）。
          #
          # Qt 路径用 QT_ROOT_DIR 环境变量（install-qt-action 必然导出），
          # 不用 steps.install-qt.outputs.qt-dir —— 该输出在本版本 action 里
          # 为空，会让 CMAKE_PREFIX_PATH 变成空串。
          cmake -S $env:CLIENT_DIR -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DLIBMPV_DIR="$env:LIBMPV_DIR"

      - name: 编译
        shell: pwsh
        run: cmake --build build --parallel

      - name: 部署 Qt6 runtime DLLs
        shell: pwsh
        run: |
          $qtBin = "$env:QT_ROOT_DIR/bin"
          & "$qtBin/windeployqt.exe" --qmldir "$env:CLIENT_DIR/src/qml" "build/himi_qt_win.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败" }

      - name: 校验产物完整性
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build'
          foreach ($f in @('himi_qt_win.exe', 'libmpv-2.dll', 'Qt6Core.dll', 'Qt6Quick.dll', 'Qt6Qml.dll')) {
            $p = Join-Path $rel $f
            if (!(Test-Path $p)) { throw "产物缺少 $f($p)" }
            Write-Host "OK: $f ($((Get-Item $p).Length) bytes)"
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: himi-qt-spike-654
          path: build/**
          if-no-files-found: error
