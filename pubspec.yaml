name: himi_syncwatch
description: "HimiSync - 私密多人异地同步观影客户端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # 网络请求
  dio: ^5.7.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 播放器
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # 声网 RTM（中国区）
  agora_rtm: ^2.2.5
  # UI 组件
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  go_router: ^14.8.1
  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mockito: ^5.4.5

flutter:
  uses-material-design: true
