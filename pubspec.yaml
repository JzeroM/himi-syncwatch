name: himi_syncwatch
description: "HIMI - 私密多人异地同步观影客户端"
publish_to: 'none'
version: 1.1.195+365

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # 网络请求
  dio: ^5.7.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 播放器
  fvp: ^0.39.0
  # FFI（Windows/macOS/iOS 网卡计数读取）
  ffi: ^2.1.0
  # 声网 RTM（中国区）
  agora_rtm: ^2.2.5
  # Windows 端 RTM（agora_rtm 仅支持 android/ios）
  himi_windows_rtm:
    path: plugins/himi_windows_rtm
  # 声网 Token 生成（纯 Dart，客户端签名）
  agora_token_generator: ^1.0.0
  # 分享
  share_plus: ^11.0.0
  # 外部链接（IMDb/TMDb/TVDB 用系统浏览器打开）
  url_launcher: ^6.3.1
  # UI 组件
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  go_router: ^14.8.1
  # 液态玻璃（真折射 shader，参数可调）
  # vendored 1.8.1 + 本地补丁 [PATCH himi]：interactive_indicator.frag
  # 色散系数 0.12→2.0（upstream 亚像素不可见）与光谱边光（醒目但有机）。
  # 包更新需手动重新同步并重打补丁。
  liquid_glass_widgets:
    path: third_party/liquid_glass_widgets
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # 传感器
  sensors_plus: ^7.1.0
  # 屏幕亮度
  screen_brightness: ^2.1.11
  # 锁屏保持
  wakelock_plus: ^1.2.8
  # 本地文件选择
  file_picker: ^8.1.7
  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^11.3.0
  logger: ^2.5.0
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  # 运行时切换应用图标（Android activity-alias / iOS CFBundleAlternateIcons）
  flutter_dynamic_icon_plus: ^1.4.1

dependency_overrides:
  # path_provider_foundation 2.6.0 拉入 objective_c，其 build hook 在非 Apple 平台报 arm64e 错误
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mockito: ^5.4.5
  # 生成各平台静态应用图标（default=neon）
  flutter_launcher_icons: ^0.14.1
  # 图标尺寸生成脚本 tool/gen_icons.dart
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icon/default.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/default.png"
    icon_size: 256
