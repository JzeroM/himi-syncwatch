name: himi_syncwatch
description: "HIMI - 私密多人异地同步观影客户端"
publish_to: 'none'
version: 1.5.4+542

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # 网络请求
  dio: ^5.7.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 播放器
  # 0.39.1: 修复 StreamController add-after-close 异常（onEvent/onStateChanged/
  # onMediaStatus 在 player 销毁后回调）；iOS scene disconnect 释放纹理播放器防崩溃
  fvp:
    path: third_party/fvp
  # 播放器第二引擎（media_kit/libmpv，仅手机/桌面，TV 模式不注册）
  # 与 NipaPlay-Reload 对齐：使用其 media-kit fork 与 libs 1.0.8。
  # 固定 NipaPlay 提交 9a3f5c1710ed21eb12e29d4bd80a6c50d57d09f8；
  # media-kit submodule 7a2135661ff37a717f11d6012fefa56cae27ef36。
  media_kit:
    path: third_party/nipaplay/media_kit
  media_kit_video:
    path: third_party/nipaplay/media_kit_video
  media_kit_libs_video:
    path: third_party/nipaplay/media-kit-upstream/libs/universal/media_kit_libs_video
  # 播放器第三引擎（Erika，Rust 内核；原生位图字幕/PGS + HDR/EDR）
  # 仅非 TV 平台注册；Android TV 不加。
  erika_flutter: ^0.2.1
  # FFI（Windows/macOS/iOS 网卡计数读取）
  ffi: ^2.1.0
  win32: ^5.10.1
  # 声网 RTM（中国区）
  agora_rtm: ^2.2.5
  # Windows 端 RTM（agora_rtm 仅支持 android/ios）
  himi_windows_rtm:
    path: plugins/himi_windows_rtm
  # 声网 Token 生成（纯 Dart，客户端签名）
  agora_token_generator: ^1.0.0
  # 分享
  share_plus: ^11.0.0
  # 外部链接（IMDb/TMDb/TVDB 用系统浏览器打开）
  url_launcher: ^6.3.1
  # UI 组件
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  go_router: ^14.8.1
  # 液态玻璃（真折射 shader，参数可调）
  # vendored 1.8.1 + 本地补丁 [PATCH himi]：interactive_indicator.frag
  # 色散系数 0.12→2.0（upstream 亚像素不可见）与光谱边光（醒目但有机）。
  # 包更新需手动重新同步并重打补丁。
  liquid_glass_widgets:
    path: third_party/liquid_glass_widgets
  # QR Code
  qr_flutter: ^4.1.0
  # 纯 Dart QR 解码：Windows 无相机/无 mobile_scanner 实现，改用图片文件解码
  zxing2: ^0.2.4
  mobile_scanner: ^6.0.11
  image_picker: ^1.1.2
  # 运行时图片解码（Windows 扫码选图；tool/gen_icons.dart 也复用）
  image: ^4.2.0
  permission_handler: ^11.3.1
  # 传感器
  sensors_plus: ^7.1.0
  # 屏幕亮度
  screen_brightness: ^2.1.11
  # 锁屏保持
  wakelock_plus: ^1.2.8
  # 本地文件选择
  file_picker: ^8.1.7
  # 应用版本读取（检测更新：Android/iOS/Windows 均可用）
  package_info_plus: ^9.0.1
  # MD5 校验（更新包完整性）
  crypto: ^3.0.6
  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_secure_storage:
    path: third_party/flutter_secure_storage
  device_info_plus: ^11.3.0
  logger: ^2.5.0
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  # 运行时切换应用图标（Android activity-alias / iOS CFBundleAlternateIcons）
  flutter_dynamic_icon_plus: ^1.4.1
  app_links: ">=6.4.1 <8.0.0"
  # HarmonyOS 平台实现（federated 插件需显式依赖才会注册）
  path_provider_ohos: ^2.2.1
  url_launcher_ohos: ^6.3.0
  screen_brightness_ohos: ^2.1.4
  package_info_plus_ohos:
    path: third_party/ohos_plugins/package_info_plus_ohos-0.0.7
  permission_handler_ohos:
    path: third_party/ohos_plugins/permission_handler_ohos-0.0.8
  wakelock_plus_ohos:
    path: third_party/ohos_plugins/wakelock_plus_ohos-0.0.3
  device_info_plus_ohos:
    path: third_party/ohos_plugins/device_info_plus_ohos-0.0.8
  flutter_secure_storage_ohos:
    path: third_party/ohos_plugins/flutter_secure_storage_ohos-1.0.0
  file_picker_ohos:
    path: third_party/ohos_plugins/file_picker_ohos-1.0.1
  himi_mpv_core:
    path: plugins/himi_mpv_core
  himi_mpv_ohos:
    path: plugins/himi_mpv_ohos
  himi_mpv_android:
    path: plugins/himi_mpv_android
  himi_mpv_windows:
    path: plugins/himi_mpv_windows

dependency_overrides:
  # path_provider_foundation 2.6.0 拉入 objective_c，其 build hook 在非 Apple 平台报 arm64e 错误
  path_provider_foundation: 2.5.1
  # erika_flutter 上游 linux 插件要求 ERIKA_LIBRARY_DIR（需源码构建 FFmpeg8+补丁 libass），
  # 首版 Linux 不启用 Erika：vendored 副本已移除 linux 平台（见 third_party/erika_flutter）。
  # 升级需按此重新同步并去掉 linux/。
  erika_flutter:
    path: third_party/erika_flutter
  # NipaPlay media-kit fork 的平台库固定为同一提交，避免 pub 解析到旧版
  # media_kit_libs_windows_video 1.0.11。
  media_kit:
    path: third_party/nipaplay/media_kit
  media_kit_video:
    path: third_party/nipaplay/media_kit_video
  media_kit_libs_android_video:
    path: third_party/nipaplay/media-kit-upstream/libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    path: third_party/nipaplay/media-kit-upstream/libs/ios/media_kit_libs_ios_video
  media_kit_libs_windows_video:
    path: third_party/nipaplay/media-kit-upstream/libs/windows/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mockito: ^5.4.5
  # 生成各平台静态应用图标（默认图标 default）
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/subfont.ttf
    - assets/images/
    - assets/images/platforms/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icon/default.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/default.png"
    icon_size: 256
