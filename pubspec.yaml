name: himi_syncwatch
description: "HIMI - 私密多人异地同步观影客户端"
publish_to: 'none'
version: 1.0.69+139

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # 网络请求
  dio: ^5.7.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 播放器
  fvp: ^0.38.1
  # 声网 RTM（中国区）
  agora_rtm: ^2.2.5
  # 声网 Token 生成（纯 Dart，客户端签名）
  agora_token_generator: ^1.0.0
  # 分享
  share_plus: ^11.0.0
  # UI 组件
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  go_router: ^14.8.1
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # 传感器
  sensors_plus: ^7.1.0
  # 屏幕亮度
  screen_brightness: ^2.1.11
  # 锁屏保持
  wakelock_plus: ^1.2.8
  # 本地文件选择
  file_picker: ^8.1.7
  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^11.3.0
  logger: ^2.5.0
  path_provider: ^2.1.5

dependency_overrides:
  # path_provider_foundation 2.6.0 拉入 objective_c，其 build hook 在非 Apple 平台报 arm64e 错误
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
