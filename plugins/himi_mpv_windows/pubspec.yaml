name: himi_mpv_windows
description: HIMI Windows MPV native-surface session (libmpv via media_kit).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  himi_mpv_core:
    path: ../himi_mpv_core
  media_kit:
    path: ../../third_party/nipaplay/media_kit
  media_kit_video:
    path: ../../third_party/nipaplay/media_kit_video

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: HimiMpvWindowsPluginCApi
