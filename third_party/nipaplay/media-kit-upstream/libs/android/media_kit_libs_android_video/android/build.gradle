import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {
    def outputDir = file("$buildDir/output")
    if (outputDir.exists()) {
        outputDir.deleteDir()
    }
    outputDir.mkdirs()

    def localDir = System.getenv("MEDIA_KIT_ANDROID_LIBMPV_DIR")
    if (localDir != null && !localDir.isEmpty()) {
        def abs = file(localDir)
        ["arm64-v8a", "armeabi-v7a", "x86_64"].each { abi ->
            def jar = new File(abs, "full-${abi}.jar")
            if (!jar.exists()) {
                throw new GradleException("MEDIA_KIT_ANDROID_LIBMPV_DIR 缺少 full-${abi}.jar: ${jar}")
            }
            copy {
                from jar
                into outputDir
            }
            println "Using local libmpv jar: ${jar}"
        }
        return
    }

    def filesToDownload = [
        ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.8/full-arm64-v8a.jar", "md5": "d8142f0317695da2b5970b49232a16fe", "destination": file("$buildDir/v1.1.8/full-arm64-v8a.jar")],
        ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.8/full-armeabi-v7a.jar", "md5": "78d9b7a5875ab8907542cad8319d1761", "destination": file("$buildDir/v1.1.8/full-armeabi-v7a.jar")],
        ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.8/full-x86_64.jar", "md5": "be8349d300f2cfaa59670b5b1a0368ce", "destination": file("$buildDir/v1.1.8/full-x86_64.jar")],
        ["url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.8/full-x86.jar", "md5": "2b46056915db8e1aa8a0e79f39071543", "destination": file("$buildDir/v1.1.8/full-x86.jar")]
    ]

    filesToDownload.each { fileInfo ->
        def destFile = fileInfo.destination
        if (destFile.exists()) {
            def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
            if (calculatedMD5 != fileInfo.md5) {
                destFile.delete()
                println "MD5 mismatch. File deleted: ${destFile}"
            }
        }

        if (!destFile.exists()) {
            destFile.parentFile.mkdirs()
            println "Downloading file from: ${fileInfo.url}"
            destFile.withOutputStream { os ->
                os << new URL(fileInfo.url).openStream()
            }

            def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
            if (calculatedMD5 != fileInfo.md5) {
                throw new GradleException("MD5 verification failed for ${destFile}")
            }
        }

        copy {
            from destFile
            into outputDir
        }
    }
}

assemble.dependsOn(downloadDependencies)
