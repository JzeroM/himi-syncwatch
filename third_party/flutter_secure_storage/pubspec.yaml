name: flutter_secure_storage
description: Flutter Secure Storage provides API to store data in secure storage. Keychain is used in iOS, KeyStore based solution is used in Android.
version: 9.2.4
repository: https://github.com/mogol/flutter_secure_storage/tree/develop/flutter_secure_storage

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.it_nomads.fluttersecurestorage
        pluginClass: FlutterSecureStoragePlugin
      ios:
        pluginClass: FlutterSecureStoragePlugin
      linux:
        default_package: flutter_secure_storage_linux
      macos:
        default_package: flutter_secure_storage_macos
      web:
        default_package: flutter_secure_storage_web
      windows:
        default_package: flutter_secure_storage_windows
      # [PATCH himi] 不在此声明 ohos 的 default_package：上游
      # flutter_secure_storage_ohos 只有 ArkTS 原生侧、没有 dartPluginClass，
      # 声明 default_package 会让 flutter tool 要求 Dart 侧实现类。
      # 该包的 ArkTS 插件已由主工程直接依赖注册，MethodChannel 名一致，
      # 默认的 MethodChannelFlutterSecureStorage 即可直接用。

dependencies:
  flutter:
    sdk: flutter
  # The design on https://flutter.dev/go/federated-plugins was to leave
  # implementation constraints as "any". We cannot do it right now as it fails pub publish
  # validation, so we set a ^ constraint.
  # https://github.com/flutter/flutter/issues/46264
  flutter_secure_storage_linux: ^1.2.2
  flutter_secure_storage_macos: ^3.1.3
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_secure_storage_web: ^1.2.1
  flutter_secure_storage_windows: ^3.1.2
  meta: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.0.0

# We need to manually declare supported platforms, because pub.dev won't find them.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
